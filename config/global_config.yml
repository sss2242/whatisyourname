timeout_s: 30
max_retries: 5
backoff_factor: 2.0
retry_on_status:
- 429
- 500
- 502
- 503
- 504
rate_limit_calls_per_second: 2.0
rate_limit_burst: 5
http_cache_ttl_hours: 24
search_budget_per_group: 15
search_budget_global: 80
entity_discovery_timeout_s: 120
cross_region_discovery: false
entity_fetch_caps:
  competitors: 5
  suppliers: 3
  customers: 3
  financial_institutions: 2
  parent_companies: 1
  subsidiaries: 0
  logistics: 1
  regulators: 0
  _default: 2
FORCE_REBUILD: false
estimation_imputer: split
vae_latent_dim: 8
vae_hidden_dim: 32
vae_epochs: 80
vae_kl_weight: 0.5
llm_provider: ''
llm_key_rotation: per_call
llm_model: ''
filing_extraction_max_filings: 8
filing_extraction_stage_size: 2
filing_extraction_stage_pause_s: 15
prediction_contract:
  primary_target: return_5d
  secondary_targets:
  - return_21d
  - return_1d
  evaluation_metric: spearman_ic
  signal_decay:
    slow: 0.003
    medium: 0.05
    fast: 0.3
  ic_inclusion_threshold: 0.02
  icir_inclusion_threshold: 0.3
forecasting:
  mode: full
  parallel_workers: 4
  fast_ensemble_tiers:
  - 3
  - 4
  - 5
  lstm_enabled: true
  distributional_vars:
  - close
  - return_1d
  - volatility_21d
  - revenue
  - fcf_yield
frequency_pipeline:
  mode: parallel
log_level: INFO
