# --- Gap 1: Options-derived signals ---
options_signals:
  put_call_ratio_weight: 0.20
  risk_reversal_weight: 0.20
  iv_skew_weight: 0.15
  vix_term_structure_weight: 0.15
  skew_index_weight: 0.15
  variance_risk_premium_weight: 0.15

# --- Gap 2: Geographic supply chain risk ---
geographic_metrics:
  geo_hhi_threshold: 0.5
  china_revenue_pct_threshold: 0.30
  tariff_exposure_weight: 0.4
  trade_policy_weight: 0.3
  geo_concentration_weight: 0.3

# --- Gap 3: Cross-asset sector rotation ---
cross_asset_signals:
  sector_rs_weight: 0.25
  sector_dispersion_weight: 0.20
  yield_curve_weight: 0.20
  usd_momentum_weight: 0.15
  cross_asset_stress_weight: 0.20

# --- Gap 4: Event calendar ---
event_calendar:
  fomc_proximity_days: 5
  earnings_proximity_days: 10
  uncertainty_premium_max: 0.15
  event_density_window_days: 30

# --- Gap 5: DCF calibration (hedge fund engine) ---
dcf_calibration:
  wacc_mean: 0.09
  wacc_std: 0.01
  terminal_growth_cap: 0.03
  n_simulations: 10000
  explicit_forecast_years: 5

# --- Gap 6: Ensemble diversity ---
model_routing:
  trend_affinity:
    kalman: 1.3
    tree: 1.1
    garch: 0.7
    baseline: 0.9
  volatile_affinity:
    garch: 1.4
    tree: 1.0
    kalman: 0.7
    baseline: 1.1
  mean_revert_affinity:
    baseline: 1.3
    kalman: 0.9
    tree: 0.8
    garch: 1.0
  reject_option_confidence_threshold: 0.15

# --- Feature selection (Boruta + PIMP + mRMR) ---
feature_selection:
  boruta_n_trials: 50
  boruta_alpha: 0.05
  boruta_rf_max_depth: 7
  pimp_n_permutations: 50
  pimp_significance: 0.05
  mrmr_max_features: 30
  min_regime_samples: 30

# --- Behavioral signals ---
behavioral_signals:
  attention_spike_threshold: 2.0
  disposition_window: 63
  lottery_low_price_threshold: 5.0

# --- Complexity signals ---
complexity_signals:
  entropy_window: 21
  price_window: 126
  lz_window: 252
  sample_entropy_r: 0.2
  perm_entropy_order: 3

# --- Feature normalization ---
feature_normalization:
  zscore_window: 63
  percentile_window: 252
  change_window: 21
  key_variables:
    - current_ratio
    - debt_to_equity_abs
    - fcf_yield
    - gross_margin
    - volatility_21d
    - pe_ratio_calc
    - revenue_growth_yoy
    - sentiment_score
    - merton_dd
    - fh_composite_score
  regime_variables:
    - current_ratio
    - debt_to_equity_abs
    - fcf_yield
    - drawdown_252d
    - volatility_21d

# --- Options signals ---
options_signals:
  delta_threshold: 0.25
  min_open_interest: 100
  near_term_dte_max: 60
  iv_window: 30

# --- Cross-asset signals ---
cross_asset_signals:
  momentum_window: 21
  stress_vix_weight: 0.3
  stress_treasury_weight: 0.25
  stress_gold_weight: 0.25
  stress_usd_weight: 0.2

# --- Event calendar ---
event_calendar:
  uncertainty_decay_rate: 0.1
  max_event_premium: 0.5
  fomc_impact_days: 3
  earnings_impact_days: 5

# --- Jump-diffusion Monte Carlo ---
jump_diffusion:
  max_lambda: 50.0
  spike_threshold_percentile: 95
  min_spike_count: 3

# --- Recursive aggregator ---
recursive_aggregator:
  max_days_forward: 21
  confidence_decay_rate: 0.05
  regime_tracking: true
