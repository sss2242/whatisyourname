# Canonical field registry -- single source of truth for field name normalization.
#
# Every canonical field used in the pipeline is listed here with:
#   - aliases: all known names from regional APIs, XBRL concepts, camelCase variants
#   - statement_type: income, balance, cashflow, profile, or quote
#   - variable_type: stock (balance sheet snapshot) or flow (period total)
#   - tier: survival hierarchy tier (1-5) or null
#
# This file is loaded by the canonical_translator, data_reconciliation,
# and cache_builder modules to eliminate scattered alias dictionaries.

