# Default priors for unknown markets
default_freq_prior: {quarterly: 0.50, semiannual: 0.20, annual: 0.30}

# ---------------------------------------------------------------------------
# Bayesian frequency detection parameters
# ---------------------------------------------------------------------------
bayesian_detection:
  gap_mean_quarterly: 90        # expected calendar days between quarterly filings
  gap_std_quarterly: 15         # std dev (accounts for fiscal calendar variation)
  gap_mean_semiannual: 180
  gap_std_semiannual: 25
  gap_mean_annual: 365
  gap_std_annual: 40

# ---------------------------------------------------------------------------
# Temporal disaggregation method selection
# ---------------------------------------------------------------------------
disaggregation:
  flow_method: chow-lin-opt     # tempdisagg method for flow variables (revenue, net_income, etc.)
  stock_method: denton-cholette  # tempdisagg method for stock variables (total_assets, etc.)
  fallback_method: fast          # when primary tempdisagg method fails

# ---------------------------------------------------------------------------
# Post-disaggregation reconciliation
# ---------------------------------------------------------------------------
reconciliation:
  sum_tolerance: 0.05           # max 5% deviation: sum(Q1..Q4) vs annual
  identity_tolerance: 0.01      # max 1% for accounting identity checks
  restatement_threshold: 0.10   # 10% change between original and amended filing = material restatement flag
