# Survival hierarchy tier definitions and weight presets.
#
# Five tiers ordered by importance during crisis (per spec):
#   tier1: Liquidity & Cash (highest priority in survival)
#   tier2: Debt & Solvency
#   tier3: Market Stability
#   tier4: Profitability (lower priority in survival)
#   tier5: Growth & Valuation (lowest priority in survival)

tiers:
  tier1:
    label: "Liquidity & Cash"
    variables:
      - cash_and_equivalents_asof
      - cash_ratio
      - free_cash_flow_ttm
      - operating_cash_flow_asof
  tier2:
    label: "Debt & Solvency"
    variables:
      - total_debt_asof
      - debt_to_equity
      - net_debt_to_ebitda
      - interest_coverage
      - current_ratio
  tier3:
    label: "Market Stability"
    variables:
      - volatility_21d
      - drawdown_252d
      - volume
  tier4:
    label: "Profitability"
    variables:
      - gross_margin
      - operating_margin
      - net_margin
  tier5:
    label: "Growth & Valuation"
    variables:
      - revenue_asof
      - pe_ratio
      - ev_to_ebitda

# Weight presets per regime.
# Weights are tier1 through tier5 and must sum to 1.0.
#
# Source: The_Apps_core_idea.pdf Section C.3-C.4.
#
# Case 1 -- Normal Company, Normal Country:
#   Standard equal weights.
# Case 2 -- Survival Company, Normal Country:
#   Company in distress, environment stable. Focus: liquidity management.
# Case 3 -- Normal Company, Survival Country (NOT protected):
#   Company healthy but environment toxic. Focus: defensive positioning.
# Case 3b -- Normal Company, Survival Country (protected):
#   Uses standard weights (company is shielded by government).
#   Handled in code: regime selector returns "normal" when protected.
# Case 4 -- Survival Company, Survival Country:
#   Both in crisis. Focus: immediate survival only.
regimes:
  normal:
    weights: [0.20, 0.20, 0.20, 0.20, 0.20]
  company_survival:
    weights: [0.50, 0.30, 0.15, 0.04, 0.01]
  modified_survival:
    # Country crisis, company healthy, NOT protected.
    weights: [0.40, 0.35, 0.20, 0.04, 0.01]
  extreme_survival:
    # Both company and country in crisis.
    weights: [0.60, 0.30, 0.10, 0.00, 0.00]

# Vanity-adjusted deltas.
# When vanity_percentage exceeds the threshold AND the company is in a
# survival regime, shift weight from Tier 4 and Tier 5 toward Tier 1.
#
# Source: The_Apps_core_idea.pdf Section C.6 --
#   "move 2% from Tier 4 and 3% from Tier 5 to Tier 1"
#   New weights become: 55/30/15/2/0 (even more emphasis on liquidity)
vanity_adjustment:
  threshold: 10.0              # vanity_percentage above which deltas apply
  tier1_delta: 0.05            # add to tier1 (liquidity)
  tier4_delta: -0.02           # subtract from tier4 (profitability)
  tier5_delta: -0.03           # subtract from tier5 (growth/valuation)

# Vanity v2 configuration.
# Proxy-based scoring that works with reliably available data.
vanity_v2:
  weights:
    rnd_mismatch: 0.15         # R&D spend vs revenue growth mismatch
    sga_bloat: 0.25            # SGA bloat relative to peers/thresholds
    capital_misallocation: 0.30  # debt/dividend misallocation signals
    competitive_decay: 0.15    # losing competitive ground
    sentiment_gap: 0.15        # sentiment vs reality disconnect
  labels:
    - [20, "Disciplined"]
    - [40, "Moderate"]
    - [70, "Wasteful"]
    - [100, "Reckless"]
  trend_window_short: 21       # days for short-term trend MA
  trend_window_long: 63        # days for long-term trend MA
  hierarchy_adjustment:
    rising_trend_multiplier: 1.5  # amplify weight shift when trend rising
    threshold: 40              # vanity_score above which adjustment applies

# ---------------------------------------------------------------------------
# Enriched survival timeline: combined state mapping
# ---------------------------------------------------------------------------
# Maps (survival_mode, market_regime) pairs to a combined state label
# and a continuous survival intensity score [0.0 = safe, 1.0 = extreme crisis].
#
# Market regime values come from HMM/GMM: bull, bear, high_vol, low_vol, unknown.
# Survival modes come from rule-based flags: normal, company_only,
#   country_protected, country_exposed, both_unprotected, both_protected.
#
# These are used by compute_enriched_survival_timeline() in
# operator1/analysis/survival_timeline.py.  The authoritative mapping is
# defined in Python code; this section is for documentation and future
# config-driven overrides.
combined_state_mapping:
  # stable states
  stable_growth:
    description: "Normal company + bull/low-vol market"
    intensity_range: [0.0, 0.10]
  elevated_risk:
    description: "Normal company + high-vol market"
    intensity_range: [0.20, 0.30]
  market_stress:
    description: "Normal company + bear market"
    intensity_range: [0.25, 0.35]
  # company distress
  company_distress_mild:
    description: "Company in survival + stable/unknown market"
    intensity_range: [0.40, 0.55]
  company_distress_severe:
    description: "Company in survival + bear/high-vol market"
    intensity_range: [0.55, 0.75]
  # country crisis
  country_crisis_mild:
    description: "Country exposed + stable market"
    intensity_range: [0.35, 0.50]
  country_crisis_severe:
    description: "Country exposed + bear/high-vol market"
    intensity_range: [0.55, 0.75]
  # protected states
  protected_stress:
    description: "Country crisis but company is government-protected"
    intensity_range: [0.10, 0.40]
  protected_crisis:
    description: "Both flags active but company is protected"
    intensity_range: [0.40, 0.70]
  # extreme
  crisis:
    description: "Both flags active, unprotected"
    intensity_range: [0.65, 0.95]
  extreme_crisis:
    description: "Both flags active, unprotected, bear market"
    intensity_range: [0.90, 1.00]
